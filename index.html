<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css"></link>
    <title>Easy Slider</title>
</head>
<body>
    <div class="slider">
        <button id="slider-prev">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M18.2071 6.29289C18.5977 6.68342 18.5977 7.31658 18.2071 7.70711L11.9142 14L18.2071 20.2929C18.5977 20.6834 18.5977 21.3166 18.2071 21.7071C17.8166 22.0976 17.1834 22.0976 16.7929 21.7071L9.96969 14.8839C9.48154 14.3957 9.48154 13.6043 9.96969 13.1161L16.7929 6.29289C17.1834 5.90237 17.8166 5.90237 18.2071 6.29289Z" fill="#ffffff"/>
            </svg>
        </button>
        <div class="slider-wrapper">
            <div class="slide">Slide1</div>
            <div class="slide">Slide2</div>
            <div class="slide">Slide3</div>
            <div class="slide">Slide4</div>
            <div class="slide">Slide5</div>
        </div>
        <button id="slider-next">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M18.2071 6.29289C18.5977 6.68342 18.5977 7.31658 18.2071 7.70711L11.9142 14L18.2071 20.2929C18.5977 20.6834 18.5977 21.3166 18.2071 21.7071C17.8166 22.0976 17.1834 22.0976 16.7929 21.7071L9.96969 14.8839C9.48154 14.3957 9.48154 13.6043 9.96969 13.1161L16.7929 6.29289C17.1834 5.90237 17.8166 5.90237 18.2071 6.29289Z" fill="#ffffff"/>
            </svg>
        </button>
    </div>

    <div id="debug"></div>

    <script src="easy-slider.js"></script>
    <script src="./script.js"></script>
</body>
</html>
